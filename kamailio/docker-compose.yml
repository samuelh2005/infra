services:
  db:
    image: mariadb:11.8
    environment:
      MARIADB_DATABASE: ${DB_NAME:-kamailio}
      MARIADB_USER: ${DB_USER:-kamailio}
      MARIADB_PASSWORD: ${DB_PASSWORD:-kamailio}
      MARIADB_ROOT_PASSWORD: ${DB_ROOT_PASSWORD:-kamailio-root}
    healthcheck:
      test: ["CMD", "healthcheck.sh", "--connect", "--innodb_initialized"]
      interval: 10s
      timeout: 5s
      retries: 12
    volumes:
      - kamailio-db:/var/lib/mysql
    networks:
      ims:

  initdb:
    build:
      context: .
    command: ["init-db"]
    depends_on:
      db:
        condition: service_healthy
    environment:
      DB_HOST: db
      DB_NAME: ${DB_NAME:-kamailio}
      DB_USER: ${DB_USER:-kamailio}
      DB_PASSWORD: ${DB_PASSWORD:-kamailio}
      DB_ROOT_PASSWORD: ${DB_ROOT_PASSWORD:-kamailio-root}
      IMS_REALM: ${IMS_REALM:-ims.example.net}
      SCSCF_FQDN: ${SCSCF_FQDN:-scscf.ims.example.net}
      SCSCF_SIP_PORT: ${SCSCF_SIP_PORT:-6060}
    restart: "no"
    networks:
      ims:

  pcscf:
    build:
      context: .
    depends_on:
      db:
        condition: service_healthy
      initdb:
        condition: service_completed_successfully
    environment:
      IMS_ROLE: pcscf
      ROLE_FQDN: ${PCSCF_FQDN:-pcscf.ims.example.net}
      IMS_REALM: ${IMS_REALM:-ims.example.net}
      SIP_BIND_IP: 0.0.0.0
      SIP_PORT: ${PCSCF_SIP_PORT:-5060}
      DIAMETER_BIND_IP: 0.0.0.0
      DIAMETER_PORT: ${PCSCF_DIAMETER_PORT:-3871}
      DIAMETER_PEER_PORT: ${PCRF_DIAMETER_PORT:-3868}
      PCRF_FQDN: ${PCRF_FQDN:-pcrf.epc.example.net}
      PCRF_REALM: ${PCRF_REALM:-epc.example.net}
      DB_HOST: db
      DB_NAME: ${DB_NAME:-kamailio}
      DB_USER: ${DB_USER:-kamailio}
      DB_PASSWORD: ${DB_PASSWORD:-kamailio}
      IPSEC_BIND_IP: 0.0.0.0
      RX_AF_SIGNALING_IP: ${RX_AF_SIGNALING_IP:-127.0.0.1}
      SBC_FQDN: ${SBC_FQDN:-sbc.ims.example.net}
      SBC_PORT: ${SBC_PORT:-5070}
    ports:
      - "${PCSCF_SIP_PORT:-5060}:${PCSCF_SIP_PORT:-5060}/udp"
      - "${PCSCF_SIP_PORT:-5060}:${PCSCF_SIP_PORT:-5060}/tcp"
    networks:
      ims:
        aliases:
          - ${PCSCF_FQDN:-pcscf.ims.example.net}

  icscf:
    build:
      context: .
    depends_on:
      db:
        condition: service_healthy
      initdb:
        condition: service_completed_successfully
    environment:
      IMS_ROLE: icscf
      ROLE_FQDN: ${ICSCF_FQDN:-icscf.ims.example.net}
      IMS_REALM: ${IMS_REALM:-ims.example.net}
      SIP_BIND_IP: 0.0.0.0
      SIP_PORT: ${ICSCF_SIP_PORT:-4060}
      DIAMETER_BIND_IP: 0.0.0.0
      DIAMETER_PORT: ${ICSCF_DIAMETER_PORT:-3869}
      DIAMETER_PEER_PORT: ${HSS_DIAMETER_PORT:-3868}
      HSS_FQDN: ${HSS_FQDN:-hss.ims.example.net}
      HSS_REALM: ${HSS_REALM:-ims.example.net}
      DB_HOST: db
      DB_NAME: ${DB_NAME:-kamailio}
      DB_USER: ${DB_USER:-kamailio}
      DB_PASSWORD: ${DB_PASSWORD:-kamailio}
    ports:
      - "${ICSCF_SIP_PORT:-4060}:${ICSCF_SIP_PORT:-4060}/udp"
      - "${ICSCF_SIP_PORT:-4060}:${ICSCF_SIP_PORT:-4060}/tcp"
    networks:
      ims:
        aliases:
          - ${ICSCF_FQDN:-icscf.ims.example.net}

  scscf:
    build:
      context: .
    depends_on:
      db:
        condition: service_healthy
      initdb:
        condition: service_completed_successfully
    environment:
      IMS_ROLE: scscf
      ROLE_FQDN: ${SCSCF_FQDN:-scscf.ims.example.net}
      ROLE_FQDN_ESC: ${SCSCF_FQDN_ESC:-scscf\.ims\.example\.net}
      IMS_REALM: ${IMS_REALM:-ims.example.net}
      IMS_REALM_ESC: ${IMS_REALM_ESC:-ims\.example\.net}
      SIP_BIND_IP: 0.0.0.0
      SIP_PORT: ${SCSCF_SIP_PORT:-6060}
      DIAMETER_BIND_IP: 0.0.0.0
      DIAMETER_PORT: ${SCSCF_DIAMETER_PORT:-3870}
      DIAMETER_PEER_PORT: ${HSS_DIAMETER_PORT:-3868}
      HSS_FQDN: ${HSS_FQDN:-hss.ims.example.net}
      HSS_REALM: ${HSS_REALM:-ims.example.net}
      DB_HOST: db
      DB_NAME: ${DB_NAME:-kamailio}
      DB_USER: ${DB_USER:-kamailio}
      DB_PASSWORD: ${DB_PASSWORD:-kamailio}
      RO_DESTINATION: ${RO_DESTINATION:-ocs.ims.example.net}
      APP_SERVER_FQDN: ${APP_SERVER_FQDN:-as.ims.example.net}
      APP_SERVER_PORT: ${APP_SERVER_PORT:-5070}
    ports:
      - "${SCSCF_SIP_PORT:-6060}:${SCSCF_SIP_PORT:-6060}/udp"
      - "${SCSCF_SIP_PORT:-6060}:${SCSCF_SIP_PORT:-6060}/tcp"
    networks:
      ims:
        aliases:
          - ${SCSCF_FQDN:-scscf.ims.example.net}

networks:
  ims:

volumes:
  kamailio-db:
